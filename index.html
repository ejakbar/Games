<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="./style.css"/>
    <title>Game JS</title>
</head>
<body>
    <section class="game">
        <div class="score">
            <div class="player-score">
                <h2> Player </h2>
                <p> 0 </p>
            </div>
            <div class="computer-score">
                <h2> Computer </h2>
                <p> 0 </p>
            </div>
        </div>
        <div class="intro fadeIn">
            <h1> Rock Paper Scissors</h1>
            <button>Lets Play</button>
        </div>
        <div class="match fadeOut">
            <h2 class="winner">Silahkan Pilih</h2>
            <div class="hands">
                <img class="player-hand" src="./assets/rock.png" alt="Player Hand" width="120" height="120">
                <img class="computer-hand" src="./assets/rock.png" alt="Computer Hand" width="120" height="120">
            </div>
            <div class="options">
                <button class="rock">Rock</button>
                <button class="paper">Paper</button>
                <button class="scissors">Scissors</button>
            </div>
        </div>
    </section>
    <script src="app.js"></script>
</body>

</html>
